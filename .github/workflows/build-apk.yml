name: Build ASTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ASTRA project
        run: |
          unzip -q ASTRA_Tactical_Phone_Only.zip
          cp -r ASTRA_Tactical_Android/app .
          cp ASTRA_Tactical_Android/settings.gradle .
          cp ASTRA_Tactical_Android/build.gradle .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
